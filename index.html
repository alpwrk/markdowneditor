<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --c0:  #000000;
    --c1:  #111111;
    --c2:  #1a1a1a;
    --c3:  #222222;
    --c4:  #2e2e2e;
    --c5:  #3a3a3a;
    --c6:  #444444;
    --c7:  #555555;
    --c8:  #666666;
    --c9:  #888888;
    --c10: #aaaaaa;
    --c11: #cccccc;
    --c12: #e0e0e0;
    --c13: #f0f0f0;
    --c14: #ffffff;
  }

  html, body { height: 100%; }

  body {
    background: var(--c1);
    color: var(--c12);
    font-family: 'IBM Plex Mono', monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: 44px;
    border-bottom: 1px solid var(--c4);
    flex-shrink: 0;
  }

  .logo {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--c14);
  }

  .wordcount {
    font-size: 11px;
    color: var(--c7);
    letter-spacing: 0.05em;
  }

  .toolbar {
    display: flex;
    gap: 2px;
    padding: 6px 12px;
    border-bottom: 1px solid var(--c4);
    background: var(--c2);
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .tb-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    background: none;
    border: 1px solid transparent;
    color: var(--c8);
    padding: 3px 8px;
    border-radius: 2px;
    cursor: pointer;
    transition: color 0.1s, border-color 0.1s;
    letter-spacing: 0.03em;
  }

  .tb-btn:hover {
    color: var(--c14);
    border-color: var(--c5);
  }

  .sep {
    width: 1px;
    background: var(--c4);
    margin: 4px 4px;
    flex-shrink: 0;
  }

  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .pane + .pane {
    border-left: 1px solid var(--c4);
  }

  .pane-label {
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--c6);
    padding: 6px 16px;
    border-bottom: 1px solid var(--c3);
    background: var(--c2);
    flex-shrink: 0;
  }

  textarea {
    flex: 1;
    width: 100%;
    background: var(--c1);
    color: var(--c11);
    border: none;
    outline: none;
    resize: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    line-height: 1.8;
    padding: 20px;
    caret-color: var(--c14);
  }

  textarea::placeholder { color: var(--c5); }
  textarea::selection { background: var(--c5); }

  .preview {
    flex: 1;
    overflow-y: auto;
    padding: 20px 28px;
    background: var(--c1);
    font-family: 'IBM Plex Serif', serif;
    font-size: 14px;
    line-height: 1.8;
    color: var(--c10);
  }

  .preview::-webkit-scrollbar { width: 4px; }
  .preview::-webkit-scrollbar-track { background: transparent; }
  .preview::-webkit-scrollbar-thumb { background: var(--c4); }

  .preview h1, .preview h2, .preview h3,
  .preview h4, .preview h5, .preview h6 {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    color: var(--c14);
    margin: 1.6em 0 0.5em;
    line-height: 1.3;
  }
  .preview h1 { font-size: 1.6em; border-bottom: 1px solid var(--c4); padding-bottom: 0.4em; }
  .preview h2 { font-size: 1.25em; }
  .preview h3 { font-size: 1.05em; color: var(--c12); }
  .preview h4, .preview h5, .preview h6 { font-size: 0.95em; color: var(--c9); }

  .preview p { margin: 0.7em 0; }
  .preview strong { color: var(--c13); font-weight: 600; }
  .preview em { color: var(--c11); font-style: italic; }

  .preview a { color: var(--c12); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--c6); }
  .preview a:hover { color: var(--c14); text-decoration-color: var(--c9); }

  .preview code {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.84em;
    background: var(--c3);
    color: var(--c12);
    padding: 0.15em 0.4em;
    border-radius: 2px;
  }

  .preview pre {
    background: var(--c2);
    border: 1px solid var(--c4);
    border-radius: 3px;
    padding: 14px 18px;
    overflow-x: auto;
    margin: 1em 0;
  }
  .preview pre code {
    background: none;
    padding: 0;
    color: var(--c10);
    font-size: 0.9em;
    line-height: 1.7;
  }

  .preview blockquote {
    border-left: 2px solid var(--c6);
    margin: 1em 0;
    padding: 0.3em 1em;
    color: var(--c8);
  }

  .preview ul, .preview ol { padding-left: 1.4em; margin: 0.7em 0; }
  .preview li { margin: 0.25em 0; }
  .preview li::marker { color: var(--c6); }

  .preview table { width: 100%; border-collapse: collapse; margin: 1em 0; font-size: 0.9em; font-family: 'IBM Plex Mono', monospace; }
  .preview th { color: var(--c12); font-weight: 500; padding: 7px 12px; border-bottom: 1px solid var(--c6); text-align: left; }
  .preview td { padding: 6px 12px; border-bottom: 1px solid var(--c3); }

  .preview hr { border: none; border-top: 1px solid var(--c4); margin: 2em 0; }
  .preview img { max-width: 100%; border-radius: 2px; }

  @media (max-width: 640px) {
    .main { flex-direction: column; }
    .pane + .pane { border-left: none; border-top: 1px solid var(--c4); }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Markdown</div>
  <div class="wordcount" id="wc">0 words</div>
</header>

<div class="toolbar">
  <button class="tb-btn" onclick="ins('**','**')">bold</button>
  <button class="tb-btn" onclick="ins('*','*')">italic</button>
  <button class="tb-btn" onclick="ins('~~','~~')">strike</button>
  <button class="tb-btn" onclick="ins('`','`')">code</button>
  <div class="sep"></div>
  <button class="tb-btn" onclick="insl('# ')">h1</button>
  <button class="tb-btn" onclick="insl('## ')">h2</button>
  <button class="tb-btn" onclick="insl('### ')">h3</button>
  <div class="sep"></div>
  <button class="tb-btn" onclick="insl('> ')">quote</button>
  <button class="tb-btn" onclick="insl('- ')">list</button>
  <button class="tb-btn" onclick="insl('1. ')">ol</button>
  <button class="tb-btn" onclick="insBlock()">```</button>
  <div class="sep"></div>
  <button class="tb-btn" onclick="insLink()">[link]</button>
  <button class="tb-btn" onclick="insl('---\n')">hr</button>
  <div class="sep"></div>
  <button class="tb-btn" onclick="clearAll()">clear</button>
</div>

<div class="main">
  <div class="pane">
    <div class="pane-label">editor</div>
    <textarea id="editor" spellcheck="false" placeholder="write markdown…"></textarea>
  </div>
  <div class="pane">
    <div class="pane-label">preview</div>
    <div class="preview" id="preview"></div>
  </div>
</div>

<script>
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const wc = document.getElementById('wc');

marked.setOptions({ breaks: true, gfm: true });

const demo = `# Markdown Editor

A minimal editor — **write** on the left, *read* on the right.

## Usage

- Type markdown in the editor
- Preview updates in real time
- Use the toolbar for quick formatting

## Code

\`\`\`js
const render = () => preview.innerHTML = marked.parse(editor.value);
editor.addEventListener('input', render);
\`\`\`

> Simplicity is the ultimate sophistication.

| Element | Syntax |
|---------|--------|
| Heading | \`# H1\` |
| Bold | \`**text**\` |
| Code | \`\`code\`\` |
`;

editor.value = demo;
render();

editor.addEventListener('input', render);
editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart;
    editor.value = editor.value.slice(0, s) + '  ' + editor.value.slice(editor.selectionEnd);
    editor.selectionStart = editor.selectionEnd = s + 2;
    render();
  }
});

function render() {
  preview.innerHTML = marked.parse(editor.value);
  const words = editor.value.trim().split(/\s+/).filter(Boolean).length;
  wc.textContent = words + ' word' + (words !== 1 ? 's' : '');
}

function ins(before, after) {
  const s = editor.selectionStart, e = editor.selectionEnd;
  const sel = editor.value.slice(s, e);
  editor.value = editor.value.slice(0, s) + before + sel + after + editor.value.slice(e);
  editor.selectionStart = s + before.length;
  editor.selectionEnd = e + before.length;
  editor.focus(); render();
}

function insl(before) {
  const s = editor.selectionStart;
  const ls = editor.value.lastIndexOf('\n', s - 1) + 1;
  editor.value = editor.value.slice(0, ls) + before + editor.value.slice(ls);
  editor.selectionStart = editor.selectionEnd = ls + before.length;
  editor.focus(); render();
}

function insBlock() { ins('```\n', '\n```'); }

function insLink() {
  const s = editor.selectionStart, e = editor.selectionEnd;
  const sel = editor.value.slice(s, e) || 'text';
  const rep = `[${sel}](url)`;
  editor.value = editor.value.slice(0, s) + rep + editor.value.slice(e);
  editor.selectionStart = s + sel.length + 3;
  editor.selectionEnd = s + rep.length - 1;
  editor.focus(); render();
}

function clearAll() {
  if (confirm('Clear everything?')) { editor.value = ''; render(); editor.focus(); }
}
</script>
</body>
</html>
